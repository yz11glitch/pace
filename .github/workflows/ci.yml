name: Snapshot checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [PaceCore, PaceStore]
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Test Swift package
        working-directory: native/Packages/${{ matrix.package }}
        run: swift test

  python:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run pytest -q

  node:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check
